[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-embed-core"
version = "0.1.0"
description = "Korean Hybrid Dense-Sparse Embedding & Qdrant Integration Core Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "kiwipiepy>=0.20.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.11.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
